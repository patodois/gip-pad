[package]
name = "gip-pad"
version = "0.2.0"
edition = "2021"
description = "Reads Xbox One / Series controllers (GIP over USB) on macOS, which has no driver for wired third-party pads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/patodois/gip-pad"
readme = "README.md"
keywords = ["xbox", "gamepad", "controller", "usb", "macos"]
categories = ["hardware-support", "os::macos-apis", "command-line-utilities"]
exclude = [".github/"]

[dependencies]
nusb = "0.2.9"
anyhow = "1"
